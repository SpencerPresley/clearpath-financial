# Local development stack. Production runs the same images against RDS
# (see infra/), so Postgres here exists only for dev and tests.
#
# Host ports are offset (55432, 56379) so this stack can run next to other
# projects' Postgres/Redis on the default ports.

name: clearpath

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file:
    - path: ${CLEARPATH_COMPOSE_ENV_FILE:-.env}
      required: false
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CLEARPATH_ENV_FILE: ""
  volumes:
    - ./backend:/app
    - /app/.venv
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clearpath}
      POSTGRES_USER: ${POSTGRES_USER:-clearpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearpath-dev}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=info

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=info --schedule /tmp/celerybeat-schedule

volumes:
  pgdata:
