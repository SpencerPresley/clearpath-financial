<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{ item_key|default:"ClearPath" }}</title></head>
<body style="font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 14px; line-height: 1.5; color: #1f2328;">
{% for paragraph in paragraphs %}<p>{{ paragraph|linebreaksbr }}</p>
{% endfor %}{% if item_key %}<p><a href="{{ item_url }}">{{ item_key }}</a>: {{ item_title }}</p>
{% endif %}<hr style="border: 0; border-top: 1px solid #d0d7de;">
<p style="color: #59636e; font-size: 12px;">Drafted by the ClearPath assistant for {{ requester }}. Approved by {{ approver }}.</p>
</body>
</html>
